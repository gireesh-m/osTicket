<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osTicket Simple API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .response {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }
        
        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        
        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        
        .ticket-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .ticket-info strong {
            color: #667eea;
        }
        
        .entry {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }
        
        .entry-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 13px;
        }
        
        .entry-message {
            color: #555;
            font-size: 13px;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 osTicket Simple API Tester</h1>
            <p>Test the Simple API endpoints directly from your browser</p>
        </div>
        
        <div class="content">
            <!-- Create Ticket Section -->
            <div class="section">
                <h2>1. Create a New Ticket</h2>
                <form id="createTicketForm">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" value="Test User" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" value="test@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" value="555-1234">
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" name="subject" value="API Test Ticket" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" required>This is a test ticket created from the browser-based API tester.</textarea>
                    </div>
                    <button type="submit">Create Ticket</button>
                </form>
                <div id="createResponse" class="response"></div>
            </div>
            
            <!-- Reply to Ticket Section -->
            <div class="section">
                <h2>2. Reply to a Ticket</h2>
                <form id="replyForm">
                    <div class="form-group">
                        <label for="ticketId">Ticket ID *</label>
                        <input type="number" id="ticketId" name="ticketId" required>
                    </div>
                    <div class="form-group">
                        <label for="replyMessage">Reply Message *</label>
                        <textarea id="replyMessage" name="replyMessage" required>This is a test reply from the browser-based API tester.</textarea>
                    </div>
                    <button type="submit">Post Reply</button>
                </form>
                <div id="replyResponse" class="response"></div>
            </div>
            
            <!-- Get Ticket Section -->
            <div class="section">
                <h2>3. Get Ticket Details</h2>
                <form id="getTicketForm">
                    <div class="form-group">
                        <label for="getTicketId">Ticket ID *</label>
                        <input type="number" id="getTicketId" name="getTicketId" required>
                    </div>
                    <button type="submit">Get Ticket</button>
                </form>
                <div id="getTicketResponse" class="response"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_BASE_URL = window.location.origin + '/osTicket/api/simple.php';
        
        // Helper function to show response
        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.className = 'response ' + (isError ? 'error' : 'success');
            element.textContent = JSON.stringify(data, null, 2);
            element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // Helper function to make API calls
        async function apiCall(url, method = 'GET', body = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            
            if (body) {
                options.body = JSON.stringify(body);
            }
            
            const response = await fetch(url, options);
            const data = await response.json();
            
            return { data, status: response.status };
        }
        
        // Create Ticket
        document.getElementById('createTicketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Creating...<span class="loading"></span>';
            
            try {
                const formData = new FormData(e.target);
                const data = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    subject: formData.get('subject'),
                    message: formData.get('message')
                };
                
                const result = await apiCall(`${API_BASE_URL}/tickets`, 'POST', data);
                
                if (result.data.success) {
                    showResponse('createResponse', result.data);
                    // Auto-fill ticket ID in reply form
                    document.getElementById('ticketId').value = result.data.data.ticket_id;
                    document.getElementById('getTicketId').value = result.data.data.ticket_id;
                } else {
                    showResponse('createResponse', result.data, true);
                }
            } catch (error) {
                showResponse('createResponse', { error: error.message }, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Ticket';
            }
        });
        
        // Reply to Ticket
        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Posting...<span class="loading"></span>';
            
            try {
                const formData = new FormData(e.target);
                const ticketId = formData.get('ticketId');
                const data = {
                    message: formData.get('replyMessage')
                };
                
                const result = await apiCall(`${API_BASE_URL}/tickets/${ticketId}/reply`, 'POST', data);
                
                if (result.data.success) {
                    showResponse('replyResponse', result.data);
                } else {
                    showResponse('replyResponse', result.data, true);
                }
            } catch (error) {
                showResponse('replyResponse', { error: error.message }, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Post Reply';
            }
        });
        
        // Get Ticket
        document.getElementById('getTicketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Loading...<span class="loading"></span>';
            
            try {
                const formData = new FormData(e.target);
                const ticketId = formData.get('getTicketId');
                
                const result = await apiCall(`${API_BASE_URL}/tickets/${ticketId}`, 'GET');
                
                if (result.data.success) {
                    const ticket = result.data.data;
                    
                    let html = `<div class="ticket-info">`;
                    html += `<strong>Ticket #${ticket.ticket_number}</strong><br>`;
                    html += `Subject: ${ticket.subject}<br>`;
                    html += `Status: ${ticket.status}<br>`;
                    html += `User: ${ticket.user.name} (${ticket.user.email})<br>`;
                    html += `Created: ${ticket.created}`;
                    html += `</div>`;
                    
                    html += `<strong>Entries (${ticket.entries.length}):</strong>`;
                    ticket.entries.forEach((entry, index) => {
                        html += `<div class="entry">`;
                        html += `<div class="entry-header">#${index + 1} [${entry.type}] ${entry.poster} - ${entry.created}</div>`;
                        html += `<div class="entry-message">${entry.message}</div>`;
                        html += `</div>`;
                    });
                    
                    const element = document.getElementById('getTicketResponse');
                    element.className = 'response success';
                    element.innerHTML = html;
                    element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    showResponse('getTicketResponse', result.data, true);
                }
            } catch (error) {
                showResponse('getTicketResponse', { error: error.message }, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get Ticket';
            }
        });
    </script>
</body>
</html>
